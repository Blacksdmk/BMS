<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BMS Global - Puentes</title>

    <!-- MapLibre GL CSS -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" />
    <!-- Chart.js -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/Chart.min.css" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        /* ===== VARIABLES ===== */
        :root {
            --bg-primary: #f4f7fc;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #1a2332;
            --text-secondary: #3a4a5e;
            --border-color: #dce4ec;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --radius: 16px;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
        }
        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background 0.3s, color 0.3s;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* ===== BARRA SUPERIOR ===== */
        #topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            z-index: 10;
            flex-wrap: wrap;
            gap: 8px;
        }
        #topbar .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.2rem;
        }
        #topbar .logo i { color: var(--accent-color); font-size: 1.6rem; }
        .right-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .top-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .top-btn:hover {
            background: var(--border-color);
            color: var(--text-primary);
        }
        #status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
        }
        #status-indicator.online { background: #22c55e; }
        #status-indicator.offline { background: #f59e0b; }

        /* ===== TABS ===== */
        #tabs {
            display: flex;
            gap: 2px;
            background: var(--bg-secondary);
            padding: 0 20px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            overflow-x: auto;
        }
        .tab-btn {
            padding: 12px 24px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            font-size: 0.95rem;
        }
        .tab-btn i { margin-right: 8px; }
        .tab-btn:hover {
            color: var(--text-primary);
            background: var(--bg-primary);
        }
        .tab-btn.active {
            color: var(--accent-color);
            border-bottom-color: var(--accent-color);
        }

        /* ===== PANELES ===== */
        #main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }
        .panel {
            display: none;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }
        .panel.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== DASHBOARD ===== */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .kpi-card {
            background: var(--bg-card);
            padding: 18px 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border-left: 5px solid var(--accent-color);
        }
        .kpi-card .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }
        .kpi-card .value {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 4px;
        }
        .kpi-card.critical { border-left-color: #ef4444; }
        .kpi-card.good { border-left-color: #22c55e; }
        .kpi-card.warning { border-left-color: #f59e0b; }

        /* ===== DIRECTORIO ===== */
        .filters-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            align-items: center;
            background: var(--bg-card);
            padding: 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .filters-row select,
        .filters-row input {
            padding: 8px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.9rem;
            min-width: 130px;
        }
        .filters-row input[type="text"] {
            flex: 1;
            min-width: 200px;
        }
        .table-wrap {
            overflow-x: auto;
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th {
            background: var(--bg-primary);
            text-align: left;
            padding: 12px 16px;
            color: var(--text-secondary);
            font-weight: 600;
            border-bottom: 2px solid var(--border-color);
        }
        td {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }
        tr:hover td { background: var(--bg-primary); }
        .badge-condition {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }
        .badge-condition.optimo { background: #dcfce7; color: #166534; }
        .badge-condition.bueno { background: #dbeafe; color: #1e40af; }
        .badge-condition.regular { background: #fef9c3; color: #854d0e; }
        .badge-condition.malo { background: #fed7aa; color: #9a3412; }
        .badge-condition.critico { background: #fecaca; color: #991b1b; }
        .btn-sm {
            padding: 4px 12px;
            border: none;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            background: var(--accent-color);
            color: white;
            transition: 0.2s;
        }
        .btn-sm:hover { background: var(--accent-hover); }
        .btn-sm.outline {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
        }
        .btn-sm.outline:hover { background: var(--accent-color); color: white; }

        /* ===== MAPA ===== */
        #map-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        #map {
            width: 100%;
            height: 100%;
            background: #e5e7eb;
        }
        .map-controls {
            position: absolute;
            top: 16px;
            right: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 5;
        }
        .map-controls button {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            box-shadow: var(--shadow);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .map-controls button:hover { background: var(--bg-primary); }
        .map-controls button.toggle-on {
            background: var(--accent-color);
            color: white;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: var(--bg-card);
            max-width: 800px;
            width: 95%;
            max-height: 90vh;
            border-radius: var(--radius);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow-y: auto;
            padding: 24px 28px;
            position: relative;
            animation: fadeIn 0.3s ease;
        }
        .modal-close {
            position: sticky;
            top: 0;
            float: right;
            background: none;
            border: none;
            font-size: 1.8rem;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .modal-close:hover { color: var(--text-primary); }

        /* ===== FORMULARIOS ===== */
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 0.9rem;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.95rem;
        }
        .form-group textarea { min-height: 80px; resize: vertical; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            #topbar .logo span { display: none; }
            .tab-btn { padding: 10px 14px; font-size: 0.8rem; }
            .tab-btn i { margin-right: 4px; }
            .kpi-grid { grid-template-columns: 1fr 1fr; }
            .filters-row select, .filters-row input { min-width: 100px; }
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }
    </style>
</head>

        // --------------------------------------------------------------
        / 3. SONIDOS (Web Audio)
        // --------------------------------------------------------------
        class SoundFX {
            constructor() { this.ctx = null; this.enabled = true; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            play(freq, dur = 0.15, type = 'sine', vol = 0.3) {
                if (!this.enabled) return;
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.value = freq;
                    gain.gain.value = vol;
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + dur);
                } catch (e) {}
            }
            hover() { this.play(600, 0.08, 'sine', 0.2); }
            click() { this.play(800, 0.1, 'sine', 0.25); }
            success() { this.play(523, 0.1); setTimeout(() => this.play(659, 0.1), 120); setTimeout(() => this.play(784, 0.15), 240); }
            error() { this.play(200, 0.3, 'sawtooth', 0.2); }
            zoom() { this.play(300, 0.3, 'sine', 0.15); this.play(600, 0.3, 'sine', 0.1); }
        }
        const sound = new SoundFX();

                document.getElementById('status-indicator').className = 'offline';

                                coordinates: { lat: 17.6200, lng: -99.5800 },
                                structuralType: 'Tipo Viga',
                                lengthMeters: 320,
                                spanCount: 8,
                                widthMeters: 14,
                                yearBuilt: 2015,
                                currentCondition: 'Optimo',
                                lastInspectionDate: '2026-06-01',
                                projectId: 'proj2'
                            }
                        },
                        inspections: {
                            'b3': {
                                'ins3': {
                                    date: '2026-06-01T11:00:00Z',
                                    inspectorName: 'Ing. Carlos Ruiz',
                                    manualScore: 92,
                                    weather: 'Soleado',
                                    observations: ['Sin novedades'],
                                    damages: [],
                                    recommendations: 'Mantenimiento preventivo.'
                                }

                    }
                }
            };

            // Guardar en Firebase
            const updates = {};
            Object.keys(demo.projects).forEach(pid => {
                const p = demo.projects[pid];
                updates[`projects/${pid}/info`] = p.info;
                Object.keys(p.bridges).forEach(bid => {

                });
                Object.keys(p.inspections).forEach(bid => {

        // --------------------------------------------------------------
        // 6. PROCESAR DATOS Y ACTUALIZAR VISTAS
        // --------------------------------------------------------------
        function processData(data) {
            state.projects = data.projects || {};
            const allBridges = [];
            const allInspections = {};

            Object.keys(state.projects).forEach(pid => {
                const proj = state.projects[pid];
                const bridges = proj.bridges || {};
                Object.keys(bridges).forEach(bid => {
                    const b = bridges[bid];
                    b.id = bid;
                    b.projectId = pid;
                    b.projectName = proj.info.name;
                    b.region = proj.info.region;
                    b.routeColor = proj.info.routeColor;
                    allBridges.push(b);
                    // Inspecciones
                    const insp = (proj.inspections && proj.inspections[bid]) || {};
                    allInspections[bid] = Object.values(insp);
                });
            });

            state.allBridges = allBridges;
            state.inspections = allInspections;

            // Actualizar vistas
            updateDashboard(allBridges, allInspections);
            updateDirectory(allBridges, allInspections);
            updateMap(allBridges, state.projects);
            populateFilters(allBridges);
            // Cargar favoritos
            applyFavorites();
        }

        //
-------------------------------------------------------------
        // 7. DASHBOARD
        // --------------------------------------------------------------
        function updateDashboard(bridges, inspections) {
            const total = bridges.length;
            const scores = [];
            let critical = 0;
            let thisMonth = 0;
            const now = new Date();
            const month = now.getMonth();
            const year = now.getFullYear();

            bridges.forEach(b => {
                const insp = inspections[b.id] || [];
                if (insp.length > 0) {
                    const last = insp.sort((a, c) => new Date(c.date) - new Date(a.date))[0];
                    if (last.manualScore !== undefined) scores.push(last.manualScore);
                    if (last.manualScore < 40) critical++;
                    const d = new Date(last.date);
                    if (d.getMonth() === month && d.getFullYear() === year) thisMonth++;
                }
            });
            const avg = scores.length ? Math.round(scores.reduce((a, v) => a + v, 0) / scores.length) : 0;

            document.getElementById('kpiTotal').textContent = total;
            document.getElementById('kpiAvg').textContent = avg;
            document.getElementById('kpiCritical').textContent = critical;
            document.getElementById('kpiInspections').textContent = thisMonth;

            // Alertas
            const alerts = [];
            bridges.forEach(b => {
                const insp = inspections[b.id] || [];
                if (insp.length > 0) {
                    const last = insp.sort((a, c) => new Date(c.date) - new Date(a.date))[0];
                    if (last.manualScore < 40) alerts.push(`🔴 ${b.name} (${b.code}) - Puntaje ${last.manualScore}`);
                }
            });
            const alertDiv = document.getElementById('alertList');
            if (alerts.length) alertDiv.innerHTML = alerts.map(a => `<div>${a}</div>`).join('');
            else alertDiv.innerHTML = '✅ No hay alertas activas.';
        }

        // --------------------------------------------------------------
        // 8. DIRECTORIO Y FILTROS
        // --------------------------------------------------------------
        function populateFilters(bridges) {
            const projects = [...new Set(bridges.map(b => b.projectName))];
            const regions = [...new Set(bridges.map(b => b.region))];
            const inspectors = [];
            Object.values(state.inspections).forEach(inspList => {
                inspList.forEach(i => {
                    if (i.inspectorName) inspectors.push(i.inspectorName);
                });
            });
            const uniqueInspectors = [...new Set(inspectors)];

            const pSelect = document.getElementById('filterProject');
            pSelect.innerHTML = '<option value="">Todos los proyectos</option>' + projects.map(p => `<option value="${p}">${p}</option>`).join('');

            const rSelect = document.getElementById('filterRegion');
            rSelect.innerHTML = '<option value="">Todas las regiones</option>' + regions.map(r => `<option value="${r}">${r}</option>`).join('');

            const iSelect = document.getElementById('filterInspector');
            iSelect.innerHTML = '<option value="">Todos los inspectores</option>' + uniqueInspectors.map(n => `<option value="${n}">${n}</option>`).join('');
        }

        function updateDirectory(bridges, inspections) {
            const body = document.getElementById('directoryBody');
            // Aplicar filtros
            const projectFilter = document.getElementById('filterProject').value;
            const regionFilter = document.getElementById('filterRegion').value;
            const conditionFilter = document.getElementById('filterCondition').value;
            const inspectorFilter = document.getElementById('filterInspector').value;
            const search = document.getElementById('filterSearch').value.toLowerCase();

            let filtered = bridges.filter(b => {
                if (projectFilter && b.projectName !== projectFilter) return false;
                if (regionFilter && b.region !== regionFilter) return false;
                if (conditionFilter && b.currentCondition !== conditionFilter) return false;
                if (search && !b.name.toLowerCase().includes(search) && !b.code.toLowerCase().includes(search)) return false;
                // Inspector: revisar última inspección
                if (inspectorFilter) {
                    const insp = inspections[b.id] || [];
                    if (insp.length === 0) return false;
                    const last = insp.sort((a, c) => new Date(c.date) - new Date(a.date))[0];
                    if (last.inspectorName !== inspectorFilter) return false;
                }
                return true;
            });

            if (filtered.length === 0) {
                body.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--text-secondary);">No hay puentes que coincidan con los filtros.</td></tr>`;
                return;
            }

            let html = '';
            filtered.forEach(b => {
                const insp = inspections[b.id] || [];
                let lastScore = '-';
                let lastDate = '-';
                if (insp.length > 0) {
                    const last = insp.sort((a, c) => new Date(c.date) - new Date(a.date))[0];
                    lastScore = last.manualScore !== undefined ? last.manualScore : '-';
                    lastDate = last.date ? new Date(last.date).toLocaleDateString() : '-';
                }
                const conditionClass = b.currentCondition ? b.currentCondition.toLowerCase() : 'regular';
                const isFavorite = state.favorites.includes(b.id);
                html += `<tr>
                    <td><strong>${b.code}</strong></td>
                    <td>${b.name}</td>
                    <td>${b.projectName || '-'}</td>
                    <td>${b.region || '-'}</td>
                    <td><span class="badge-condition ${conditionClass}">${b.currentCondition || 'N/A'}</span></td>
                    <td>${lastScore}</td>
                    <td>
                        <button class="btn-sm" onclick="window.viewBridge('${b.id}')"><i class="fas fa-eye"></i></button>
                        <button class="btn-sm outline favorite-btn" data-id="${b.id}" onclick="window.toggleFavorite('${b.id}')">
                            <i class="fas fa-star" style="color:${isFavorite ? '#f59e0b' : 'var(--text-secondary)'}"></i>
                        </button>
                    </td>
                </tr>`;
            });
            body.innerHTML = html;
        }

        // Funciones globales para los botones
        window.viewBridge = function(bridgeId) {
            openBridgeModal(bridgeId);
        };
        window.toggleFavorite = function(bridgeId) {
            const idx = state.favorites.indexOf(bridgeId);
            if (idx > -1) state.favorites.splice(idx, 1);
            else state.favorites.push(bridgeId);
            localStorage.setItem('favorites', JSON.stringify(state.favorites));
            applyFavorites();
            // Actualizar tabla
            updateDirectory(state.allBridges, state.inspections);
        };

        function applyFavorites() {
            // Se actualiza al renderizar
        }

        //
 // 9. MAPA (MapLibre)
        // --------------------------------------------------------------
        function updateMap(bridges, projects) {
            if (!state.map) {
                // Inicializar mapa con estilo gratuito de OpenStreetMap
                state.map = new maplibregl.Map({
                    container: 'map',
                    style: {
                        version: 8,
                        sources: {
                            'osm': {
                                type: 'raster',
                                tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
                                tileSize: 256,
                                attribution: '© OpenStreetMap'
                            }
                        },
                        layers: [{
                            id: 'osm',
                            type: 'raster',
                            source: 'osm'
                        }]
                    },
                    center: [-99.2, 19.3],
                    zoom: 10,
                    pitch: 45,
                    bearing: 0,
                    antialias: true
                });
                state.map.on('load', () => {
                    addBridgeMarkers(bridges, projects);
                    addProjectRoutes(projects);
                });
                // Controles de mapa
                state.map.addControl(new maplibregl.NavigationControl(), 'bottom-right');
            } else {
                // Actualizar marcadores
                addBridgeMarkers(bridges, projects);
                addProjectRoutes(projects);
            }
        }

        function addBridgeMarkers(bridges, projects) {
            const map = state.map;
            // Eliminar capas y fuentes previas
            if (map.getSource('bridges')) {
                map.removeLayer('bridges-points');
                map.removeLayer('bridges-heatmap');
                map.removeSource('bridges');
            }

            const features = bridges.map(b => ({
                type: 'Feature',
                geometry: { type: 'Point', coordinates: [b.coordinates.lng, b.coordinates.lat] },
                properties: {
                    id: b.id,
                    name: b.name,
                    code: b.code,
                    condition: b.currentCondition || 'Regular',
                    projectId: b.projectId,
                    score: getLastScore(b.id)
                }
            }));

            const geoJson = { type: 'FeatureCollection', features };

            map.addSource('bridges', { type: 'geojson', data: geoJson });

            // Capa de círculos 3D (con altura simulada)
            map.addLayer({
                id: 'bridges-points',
                type: 'circle',
                source: 'bridges',
                paint: {
                    'circle-radius': [
                        'interpolate', ['linear'], ['zoom'],
                        8, 8,
                        15, 20
                    ],
                    'circle-color': [
                        'match', ['get', 'condition'],
                        'Optimo', '#22c55e',
                        'Bueno', '#3b82f6',
                        'Regular', '#f59e0b',
                        'Malo', '#f97316',
                        'Critico', '#ef4444',
                        '#94a3b8'
                    ],
                    'circle-opacity': 0.9,
                    'circle-stroke-color': '#ffffff',
                    'circle-stroke-width': 2,
                    'circle-pitch-alignment': 'map',
                    'circle-pitch-scale': 'map'
                }
            }, 'osm');

            // Heatmap layer (inicialmente oculta)
            map.addLayer({
                id: 'bridges-heatmap',
                type: 'heatmap',
                source: 'bridges',
                paint: {
                    'heatmap-weight': [
                        'interpolate', ['linear'], ['get', 'score'],
                        0, 0,
                        100, 1
                    ],
                    'heatmap-radius': ['interpolate', ['linear'], ['zoom'], 8, 20, 15, 50],
                    'heatmap-opacity': 0.6,
                    'heatmap-color': [
                        'interpolate', ['linear'],
                        ['heatmap-density'],
                        0, 'rgba(0,0,255,0)',
                        0.2, 'rgba(0,0,255,0.4)',
                        0.4, 'rgba(0,255,255,0.6)',
                        0.6, 'rgba(0,255,0,0.8)',
                        0.8, 'rgba(255,255,0,0.9)',
                        1, 'rgba(255,0,0,1)'
                    ]
                }
            }, 'bridges-points');
            map.setLayoutProperty('bridges-heatmap', 'visibility', 'none');

            // Interacción hover
            map.on('mouseenter', 'bridges-points', () => { map.getCanvas().style.cursor = 'pointer'; sound.hover(); });
            map.on('mouseleave', 'bridges-points', () => { map.getCanvas().style.cursor = ''; });
            map.on('click', 'bridges-points', (e) => {
                const id = e.features[0].properties.id;
                openBridgeModal(id);
                sound.click();
            });
        }

        function addProjectRoutes(projects) {
            const map = state.map;
            if (map.getSource('routes')) {
                map.removeLayer('routes-line');
                map.removeSource('routes');
            }
            const features = [];
            Object.keys(projects).forEach(pid => {
                const proj = projects[pid];
                const route = proj.info.route;
                if (route && route.coordinates) {
                    features.push({
                        type: 'Feature',
                        geometry: { type: 'LineString', coordinates: route.coordinates },
                        properties: {
                            color: proj.info.routeColor || '#2563eb',
                            projectId: pid
                        }
                    });
                }
            });
            const geoJson = { type: 'FeatureCollection', features };
            if (features.length === 0) return;

            map.addSource('routes', { type: 'geojson', data: geoJson });
            map.addLayer({
                id: 'routes-line',
                type: 'line',
                source: 'routes',
                paint: {
                    'line-color': ['get', 'color'],
                    'line-width': 4,
                    'line-opacity': 0.7,
                    'line-gap-width': 2
                }
            }, 'bridges-points');

            // Animación de ruta (se dibuja sola)
            let progress = 0;
            const animateRoute = () => {
                if (progress > 1) return;
                progress += 0.01;
                map.setPaintProperty('routes-line', 'line-dasharray', [progress * 100, 100]);
                if (progress < 1) requestAnimationFrame(animateRoute);
            };
            setTimeout(animateRoute, 500);
        }

        function getLastScore(bridgeId) {
            const insp = state.inspections[bridgeId] || [];
            if (insp.length === 0) return 50;
            const last = insp.sort((a, c) => new Date(c.date) - new Date(a.date))[0];
            return last.manualScore || 50;
        }

        //
------------------------------------------------------------
        // 10. MODAL DE DETALLE DEL PUENTE
        // --------------------------------------------------------------
        function openBridgeModal(bridgeId) {
            const bridge = state.allBridges.find(b => b.id === bridgeId);
            if (!bridge) return;
            state.currentBridgeId = bridgeId;
            document.getElementById('bridgeModal').classList.add('open');
            document.getElementById('modalBridgeName').textContent = `${bridge.code} - ${bridge.name}`;
            renderModalTab('info', bridge);
            // Manejar tabs del modal
            document.querySelectorAll('#modalTabs .tab-btn').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('#modalTabs .tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderModalTab(btn.dataset.modalTab, bridge);
                };
            });
            sound.click();
        }

        function renderModalTab(tab, bridge) {
            const container = document.getElementById('modalTabContent');
            const insp = state.inspections[bridge.id] || [];
            const sortedInsp = [...insp].sort((a, c) => new Date(c.date) - new Date(a.date));

            if (tab === 'info') {
                const last = sortedInsp.length > 0 ? sortedInsp[0] : null;
                container.innerHTML = `
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px;">
                        <div><strong>Tipo:</strong> ${bridge.structuralType || 'N/A'}</div>
                        <div><strong>Longitud:</strong> ${bridge.lengthMeters || '?'} m</div>
                        <div><strong>Claros:</strong> ${bridge.spanCount || '?'}</div>
                        <div><strong>Ancho:</strong> ${bridge.widthMeters || '?'} m</div>
                        <div><strong>Año construcción:</strong> ${bridge.yearBuilt || '?'}</div>
                        <div><strong>Condición:</strong> <span class="badge-condition ${bridge.currentCondition.toLowerCase()}">${bridge.currentCondition}</span></div>
                        <div><strong>Última inspección:</strong> ${last ? new Date(last.date).toLocaleDateString() : 'N/A'}</div>
                        <div><strong>Puntaje:</strong> ${last ? last.manualScore : 'N/A'}</div>
                    </div>
                    <div style="margin-top:20px;">
                        <button class="btn-sm" onclick="window.addInspection('${bridge.id}')"><i class="fas fa-plus"></i> Nueva inspección</button>
                        <button class="btn-sm outline" onclick="window.shareBridge('${bridge.id}')"><i class="fas fa-share"></i> Compartir</button>
                    </div>
                `;
            } else if (tab === 'inspections') {
                if (sortedInsp.length === 0) {
                    container.innerHTML = '<p style="color:var(--text-secondary);">No hay inspecciones registradas.</p>';
                } else {
                    let html = '';
                    sortedInsp.forEach((ins, idx) => {
                        html += `
                            <div style="border:1px solid var(--border-color); border-radius:8px; padding:12px; margin-bottom:12px;">
                                <div style="display:flex; justify-content:space-between;">
                                    <strong>${new Date(ins.date).toLocaleDateString()}</strong>
                                    <span>Puntaje: ${ins.manualScore}</span>
                                </div>
                                <div><strong>Inspector:</strong> ${ins.inspectorName || 'N/A'}</div>
                                <div><strong>Clima:</strong> ${ins.weather || 'N/A'}</div>
                                <div><strong>Observaciones:</strong> ${(ins.observations || []).join(', ') || 'Ninguna'}</div>
                                ${ins.damages && ins.damages.length ? `<div><strong>Daños:</strong> ${ins.damages.map(d => `${d.type} (${d.severity})`).join(', ')}</div>` : ''}
                                <div><strong>Recomendaciones:</strong> ${ins.recommendations || 'N/A'}</div>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                }
            } else if (tab === 'history') {
                // Gráfica de evolución
                container.innerHTML = `<div style="height:250px;"><canvas id="historyChart"></canvas></div>`;
                setTimeout(() => {
                    const ctx = document.getElementById('historyChart').getContext('2d');
                    if (state.chart) state.chart.destroy();
                    const labels = sortedInsp.map(i => new Date(i.date).toLocaleDateString()).reverse();
                    const data = sortedInsp.map(i => i.manualScore).reverse();
                    state.chart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Puntaje',
                                data: data,
                                borderColor: '#2563eb',
                                backgroundColor: 'rgba(37,99,235,0.1)',
                                fill: true,
                                tension: 0.3,
                                pointBackgroundColor: data.map(v => v < 40 ? '#ef4444' : '#2563eb')
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: { y: { min: 0, max: 100 } }
                        }
                    });
                }, 100);
            } else if (tab === 'gallery') {
                // Fotos de inspecciones (Base64)
                let images = [];
                sortedInsp.forEach(ins => {
                    if (ins.damages) {
                        ins.damages.forEach(d => {
                            if (d.imageBase64 && d.imageBase64.length > 100) {
                                images.push({ src: d.imageBase64, caption: d.type });
                            }
                        });
                    }
                });
                if (images.length === 0) {
                    container.innerHTML = '<p style="color:var(--text-secondary);">No hay imágenes disponibles.</p>';
                } else {
                    container.innerHTML = `<div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;">
                        ${images.map(img => `<div><img src="${img.src}" style="width:100%; border-radius:8px; cursor:pointer;" onclick="window.open('${img.src}')"/><div style="font-size:0.8rem; margin-top:4px;">${img.caption}</div></div>`).join('')}
                    </div>`;
                }
            }
        }

        // Funciones globales del modal
        window.addInspection = function(bridgeId) {
            // Abrir formulario de inspección (simplificado)
            const bridge = state.allBridges.find(b => b.id === bridgeId);
            if (!bridge) return;
            const score = prompt('Ingrese puntaje (0-100):');
            if (score === null) return;
            const numScore = parseInt(score);
            if (isNaN(numScore) || numScore < 0 || numScore > 100) { alert('Puntaje inválido'); return; }
            const obs = prompt('Observaciones (separadas por coma):');
            const obsArray = obs ? obs.split(',').map(s => s.trim()) : [];
            const newInspection = {
                date: new Date().toISOString(),
                inspectorName: 'Inspector App',
                manualScore: numScore,
                weather: 'No especificado',
                observations: obsArray,
                damages: [],
                recommendations: 'Pendiente'
            };
            const inspRef = ref(db, `projects/${bridge.projectId}/inspections/${bridgeId}`);
            push(inspRef, newInspection).then(() => {
                sound.success();
                alert('Inspección guardada.');
                // Recargar datos
                loadData();
            }).catch(err => { alert('Error: '+err.message); sound.error(); });
        };

        window.shareBridge = function(bridgeId) {
            const bridge = state.allBridges.find(b => b.id === bridgeId);
            if (!bridge) return;
            const url = window.location.href + `?bridge=${bridgeId}`;
            if (navigator.share) {
                navigator.share({ title: bridge.name, text: `Inspección de ${bridge.name}`, url });
            } else {
                navigator.clipboard.writeText(url).then(() => alert('Enlace copiado al portapapeles.'));
            }
        };

        // Cerrar modal
        document.getElementById('closeModal').onclick = () => {
            document.getElementById('bridgeModal').classList.remove('open');
            if (state.chart) { state.chart.destroy(); state.chart = null; }
        };

        //
// 11. CONTROLES DEL MAPA
        // --------------------------------------------------------------
        document.getElementById('toggleHeatmap').onclick = function() {
            const map = state.map;
            if (!map) return;
            state.heatmapVisible = !state.heatmapVisible;
            map.setLayoutProperty('bridges-heatmap', 'visibility', state.heatmapVisible ? 'visible' : 'none');
            this.classList.toggle('toggle-on');
            sound.click();
        };

        document.getElementById('toggleWeather').onclick = function() {
            // Simular capa de clima (añadir nubes)
            const map = state.map;
            if (!map) return;
            state.weatherVisible = !state.weatherVisible;
            if (state.weatherVisible) {
                // Agregar capa de nubes (tiles de OpenWeatherMap o similar, aquí simulamos con una capa de raster)
                if (!map.getSource('weather')) {
                    map.addSource('weather', {
                        type: 'raster',
                        tiles: ['https://tile.openweathermap.org/map/clouds_new/{z}/{x}/{y}.png?appid=TU_API_KEY'],
                        tileSize: 256
                    });
                    map.addLayer({
                        id: 'weather-layer',
                        type: 'raster',
                        source: 'weather',
                        paint: { 'raster-opacity': 0.3 }
                    }, 'bridges-points');
                }
                map.setLayoutProperty('weather-layer', 'visibility', 'visible');
                this.classList.add('toggle-on');
            } else {
                if (map.getLayer('weather-layer')) {
                    map.setLayoutProperty('weather-layer', 'visibility', 'none');
                }
                this.classList.remove('toggle-on');
            }
            sound.click();
        };

        document.getElementById('measureBtn').onclick = function() {
            state.measureMode = !state.measureMode;
            this.classList.toggle('toggle-on');
            if (state.measureMode) {
                alert('Haz clic en el mapa para medir distancias. Haz clic de nuevo en el botón para terminar.');
                state.map.on('click', measureClick);
            } else {
                state.map.off('click', measureClick);
                // Limpiar mediciones
                if (state.map.getSource('measure')) {
                    state.map.removeLayer('measure-line');
                    state.map.removeLayer('measure-points');
                    state.map.removeSource('measure');
                }
                state.measurePoints = [];
            }
            sound.click();
        };

        function measureClick(e) {
            const pt = e.lngLat;
            state.measurePoints.push(pt);
            if (state.measurePoints.length > 1) {
                // Dibujar línea
                const coords = state.measurePoints.map(p => [p.lng, p.lat]);
                const geojson = {
                    type: 'FeatureCollection',
                    features: [{
                        type: 'Feature',
                        geometry: { type: 'LineString', coordinates: coords },
                        properties: {}
                    }]
                };
                if (!state.map.getSource('measure')) {
                    state.map.addSource('measure', { type: 'geojson', data: geojson });
                    state.map.addLayer({
                        id: 'measure-line',
                        type: 'line',
                        source: 'measure',
                        paint: { 'line-color': '#ef4444', 'line-width': 3, 'line-dasharray': [4, 4] }
                    });
                } else {
                    state.map.getSource('measure').setData(geojson);
                }
                // Calcular distancia
                const last = state.measurePoints.length - 1;
                const dist = state.measurePoints[last - 1].distanceTo(state.measurePoints[last]);
                const km = (dist / 1000).toFixed(2);
                alert(`Distancia: ${km} km`);
            }
        }

        document.getElementById('resetViewBtn').onclick = function() {
            if (state.map) {
                state.map.flyTo({ center: [-99.2, 19.3], zoom: 10, pitch: 45 });
                sound.click();
            }
        };

        // --------------------------------------------------------------
        // 12. NAVEGACIÓN PESTAÑAS
        // --------------------------------------------------------------
        document.querySelectorAll('.tab-btn[data-tab]').forEach(btn => {
            btn.onclick = function() {
                const tab = this.dataset.tab;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                document.getElementById(`panel-${tab}`).classList.add('active');
                if (tab === 'map' && state.map) {
                    state.map.resize();
                }
                sound.click();
            };
        });

        // --------------------------------------------------------------
        // 13. TEMA OSCURO
        // --------------------------------------------------------------
        document.getElementById('themeToggle').onclick = function() {
            state.darkMode = !state.darkMode;
            document.documentElement.setAttribute('data-theme', state.darkMode ? 'dark' : 'light');
            this.querySelector('i').className = state.darkMode ? 'fas fa-sun' : 'fas fa-moon';
            sound.click();
        };

        // --------------------------------------------------------------
        // 14. SONIDOS TOGGLE
        // --------------------------------------------------------------
        document.getElementById('soundToggle').onclick = function() {
            sound.enabled = !sound.enabled;
            this.querySelector('i').className = sound.enabled ? 'fas fa-volume-up' : 'fas fa-volume-mute';
            sound.click();
        };

        //
   // 15. MODO PRESENTACIÓN
        // --------------------------------------------------------------
        document.getElementById('presentationBtn').onclick = function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                // Ocultar topbar y tabs
                document.getElementById('topbar').style.display = 'none';
                document.getElementById('tabs').style.display = 'none';
            } else {
                document.exitFullscreen();
                document.getElementById('topbar').style.display = 'flex';
                document.getElementById('tabs').style.display = 'flex';
            }
            sound.click();
        };
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                document.getElementById('topbar').style.display = 'flex';
                document.getElementById('tabs').style.display = 'flex';
            }
        });

        // --------------------------------------------------------------
        // 16. FILTROS EN DIRECTORIO
        // --------------------------------------------------------------
        document.querySelectorAll('#filterProject, #filterRegion, #filterCondition, #filterInspector, #filterSearch').forEach(el => {
            el.addEventListener('change', () => updateDirectory(state.allBridges, state.inspections));
            el.addEventListener('input', () => updateDirectory(state.allBridges, state.inspections));
        });
        document.getElementById('clearFilters').onclick = function() {
            document.querySelectorAll('.filters-row select, .filters-row input').forEach(el => {
                if (el.tagName === 'SELECT') el.selectedIndex = 0;
                else if (el.tagName === 'INPUT') el.value = '';
            });
            updateDirectory(state.allBridges, state.inspections);
            sound.click();
        };

        // --------------------------------------------------------------
        // 17. DETECTAR PARÁMETROS DE URL (para compartir)
        // --------------------------------------------------------------
        const params = new URLSearchParams(window.location.search);
        const bridgeParam = params.get('bridge');
        if (bridgeParam) {
            setTimeout(() => {
                openBridgeModal(bridgeParam);
            }, 1000);
        }

        // --------------------------------------------------------------
        // 18. INICIALIZAR
        // --------------------------------------------------------------
        console.log('🚀 BMS Global iniciado. ¡Bienvenido!');
        // Forzar resize del mapa al cambiar de pestaña
        window.addEventListener('resize', () => { if (state.map) state.map.resize(); });

        // Cargar datos por primera vez (ya se hace en onAuthStateChanged)
        // Pero si ya está autenticado, loadData se llama ahí.
        // Si no, esperamos.
        // Como respaldo, llamamos loadData después de 2s si no se cargó.
        setTimeout(() => {
            if (state.allBridges.length === 0) {
                loadData();
            }
        }, 3000);
    </script>
</body>
</html>
